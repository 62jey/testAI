services:
  - type: web
    name: lucy-market-analysis
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: TWELVE_DATA_API_KEY
        value: b18b7eb5815a4841bcb45ba80f3069ab
      - key: DERIV_APP_ID
        value: "1089"
      - key: LUCY_DB_PATH
        value: /tmp/lucy.db
      - key: LUCY_CACHE_SECONDS
        value: "120"
